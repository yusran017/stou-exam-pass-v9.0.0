<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Aqua Gel Base Gradient -->
    <linearGradient id="aquaBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <!-- Top Gloss Reflection (Apple Aqua Classic Highlight) -->
    <linearGradient id="aquaGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Bottom Internal Refraction Glow -->
    <radialGradient id="bottomGlow" cx="50%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Deep Ambient Drop Shadow -->
    <filter id="aquaDropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#002b4d" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="silverPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Base Squircle with Shadow -->
  <rect x="36" y="36" width="440" height="440" rx="104" fill="url(#aquaBody)" filter="url(#aquaDropShadow)"/>
  
  <!-- Subtle Outer Rim Reflection -->
  <rect x="38" y="38" width="436" height="436" rx="102" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Bottom Internal Refraction Glow -->
  <rect x="36" y="36" width="440" height="440" rx="104" fill="url(#bottomGlow)"/>

  <!-- Classic Aqua Top Gel Highlight Bubble -->
  <path d="M 40 140 C 40 85, 85 40, 140 40 L 372 40 C 427 40, 472 85, 472 140 C 472 230, 400 270, 256 270 C 112 270, 40 230, 40 140 Z" fill="url(#aquaGloss)"/>

  <!-- Academic Emblem: Mac OS X Silver Cap & Book -->
  <g transform="translate(0, 8)" filter="drop-shadow(0 6px 8px rgba(0,25,50,0.4))">
    <!-- Graduation Cap Top Diamond -->
    <path d="M 256 160 L 376 210 L 256 260 L 136 210 Z" fill="url(#silverPlate)"/>
    <path d="M 256 160 L 376 210 L 256 260 L 136 210 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Cap Under-band -->
    <path d="M 180 232 L 180 285 C 180 310, 332 310, 332 285 L 332 232" fill="none" stroke="url(#silverPlate)" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Cap Tassel -->
    <path d="M 376 210 L 376 270" stroke="#fef08a" stroke-width="5" stroke-linecap="round"/>
    <circle cx="376" cy="275" r="7" fill="#facc15"/>

    <!-- Open Book / Exam Pass Pages -->
    <path d="M 160 330 C 205 320, 250 332, 256 342 C 262 332, 307 320, 352 330 L 352 390 C 307 380, 262 392, 256 400 C 250 392, 205 380, 160 390 Z" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M 256 342 L 256 400" stroke="#94a3b8" stroke-width="3"/>
    
    <!-- Checkmark Badge on Book -->
    <circle cx="330" cy="345" r="14" fill="#38bdf8"/>
    <path d="M 324 345 L 328 349 L 336 341" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
